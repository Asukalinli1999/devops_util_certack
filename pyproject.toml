[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certack-utils"
version = "1.0.0"
description = "Ops plugins for Certack fleet monitoring"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
certack-utils = "certack_utils.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["certack_utils*"]
